spring.application.name=JobAndRecruitment
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456@

spring.datasource.url=jdbc:mysql://localhost:3306/job_prj?createDatabaseIfNotExist=true

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Cấu hình ghi log ra console
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd hh:mm:ss.SSS} -  %highlight(%-5level) - %cyan(%logger{50}) - %green(%msg%n)
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.com.example.jobandrecruitment=INFO

# JWT configuration
jwt.secret=ChangeThisSecretKeyForProductionUsePleaseChangeItToAStrongRandomValue
jwt.expiration-ms=86400000


